syntax = "proto3";
package slg;

message WorldSite {
  uint32 id = 1;
  string name = 2;
  string kind = 3;
  uint32 x = 4;
  uint32 y = 5;
}

//ResponseType S2C_WorldSnapshot
// @ets.msg protocol=Slg method=WorldSnapshot
message C2S_WorldSnapshot // IRequest
{
}

message S2C_WorldSnapshot // IResponse
{
  string world_name = 1;
  uint32 width = 2;
  uint32 height = 3;
  repeated WorldSite sites = 4;
  string stage = 5;
}
